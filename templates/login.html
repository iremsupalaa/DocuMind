<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>DocuMind · Giriş</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --background: #0b0e0b;
      --surface: #151b14;
      --surface-muted: #0f140f;
      --border: #2d382b;
      --text: #f4f7ef;
      --muted: #9da897;
      --accent: #d9ff63;
      --accent-ink: #172000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 5% 0, #344523 0, transparent 27rem),
        radial-gradient(circle at 100% 100%, #1b2c1c 0, transparent 26rem),
        var(--background);
      color: var(--text);
    }

    .login-card {
      width: min(470px, 100%);
      padding: clamp(28px, 5vw, 44px);
      background: #151b14e8;
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 24px 70px #00000045;
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .subtitle {
      max-width: 34ch;
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 18px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #d3dacd;
      font-size: .88rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-muted);
      color: var(--text);
      font: inherit;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    input:focus {
      outline: 0;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #d9ff6320;
    }

    button {
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
    }

    button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .error {
      margin: 0;
      padding: 12px 13px;
      border: 1px solid #78483b;
      border-radius: 11px;
      background: #2d1d19;
      color: #ffab91;
      font-size: .9rem;
      line-height: 1.4;
    }

    .login-footer {
      margin: 22px 0 0;
      color: #7f8a78;
      font-size: .78rem;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <p class="eyebrow"></p>
    <h1>DocuMind</h1>

    <p class="subtitle">
      Sayaçlarınızla ilgili sorular sorun.
    </p>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
      <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
      >

      <label for="email">ThingsBoard e-posta adresi</label>

        <input
          type="email"
          name="email"
          autocomplete="email"
          required
          autofocus
        >
      </label>

      <label>
        Parola

        <input
          type="password"
          name="password"
          autocomplete="current-password"
          required
        >
      </label>

      <button type="submit">Giriş yap</button>
    </form>

    <p class="login-footer">
      Giriş yaptığınızda yalnızca erişim yetkiniz olan belge
      kütüphaneleri kullanılacaktır.
    </p>
  </main>
</body>
</html>
